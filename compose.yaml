services:
  mlflow:
    build:
      context:.
      dockerfile: docker/mlflow.Dockerfile
    container_name: tfm_mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

  app:
    build:
      context:.
      dockerfile: docker/app.Dockerfile
    container_name: tfm_app
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      -./:/app
    working_dir: /app
    # Se mantiene vivo para ejecutar comandos (make...) dentro del contenedor.
    command: ["sleep", "infinity"]

  serve:
    build:
      context:.
      dockerfile: docker/app.Dockerfile
    container_name: tfm_serve
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      -./:/app
    working_dir: /app
    ports:
      - "8000:8000"
    # Servicio REST de inferencia [OE4]. Requiere modelo ya entrenado
    # (models/best_model, ver `make train`) montado desde el host.
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "src.serve.app:app"]
    restart: unless-stopped

volumes:
  mlflow_data:
