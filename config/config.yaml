# Configuración central del proyecto. Versionada: nada de esto se hardcodea en el código.
project:
  name: tfm-mlops-variantes
  random_seed: 42
  assembly: GRCh38

data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  # Partición temporal: train es la release antigua y test la nueva.
  clinvar_train_release: "2023-12"
  clinvar_test_release: "2025-06"
  chromosomes_subset: ["1", "2", "3"]
  # Acota el volumen antes de anotar: chr1-3 reales son cientos de miles de
  # variantes, y con `multi_source` cada una cuesta una consulta de red.
  max_variants_per_release: 8000
  # Variantes genuinamente nuevas que se añaden en la segunda release, además de
  # la cohorte retenida. Sin este cupo, y como ClinVar es acumulativo, la cohorte
  # agota ella sola el límite anterior y el holdout no visto queda casi vacío.
  max_new_variants_per_release: 4000
  # Tercera release, publicada después de fijar el par de entrenamiento y nunca
  # usada para entrenar ni seleccionar: es la que permite validar de forma
  # prospectiva el modelo de reclasificación en vez de solo retrospectiva.
  clinvar_prospective_release: "2026-08"
  # Fuente de features (ADR 005, ADR 007):
  #   multi_source -> myvariant.info real; única fuente de resultados citables.
  #   synthetic    -> generador determinista, reservado a pruebas y CI, donde cada
  #                   test lo fija de forma explícita en su propia configuración.
  annotation_source: multi_source

sources:
  clinvar:
    base_url: "https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/archive_2.0"
    releases:
      "2023-12": "2023/clinvar_20231203.vcf.gz"
      "2025-06": "2025/clinvar_20250601.vcf.gz"
      "2026-08": "2026/clinvar_20260808.vcf.gz"
  dbnsfp:
    # Descartado como fuente por exigir registro académico (ADR 007). Se conserva
    # la referencia porque el generador offline imita su esquema.
    academic_note: "dbNSFP exige registro académico; sustituido por myvariant.info."
    version: "4.9a"

# Generador determinista para pruebas y CI (ADR 005). Nunca se activa solo: hay
# que pedirlo de forma explícita con `annotation_source: synthetic` o con la
# bandera correspondiente del comando de ingesta.
synthetic:
  seed: 42
  n_variants_train: 6000
  n_new_in_test: 1200
  frac_reclassified: 0.06

target:
  positive_labels: ["Pathogenic", "Likely_pathogenic", "Pathogenic/Likely_pathogenic"]
  negative_labels: ["Benign", "Likely_benign", "Benign/Likely_benign"]
  # VUS estricta: la única categoría reservada como población de inferencia.
  vus_labels: ["Uncertain_significance"]
  # Informativo. Todo `clnsig` que no sea positivo, negativo ni VUS se excluye
  # automáticamente: no se codifica una lista cerrada porque ClinVar cambia el
  # vocabulario entre releases (Conflicting_interpretations_of_pathogenicity en
  # 2023-12 pasa a Conflicting_classifications_of_pathogenicity en 2025-06).
  exclude_labels_example: ["Conflicting_interpretations_of_pathogenicity", "not_provided"]

mlflow:
  tracking_uri: http://localhost:5000
  experiment_name: variant_pathogenicity
  registered_model_name: variant_pathogenicity_clf
  reclass_experiment_name: vus_reclassification_potential
  reclass_registered_model_name: vus_reclassification_clf
  ranking_experiment_name: vus_ranking

monitor:
  drift_threshold: 0.15 # proporción de columnas con drift que dispara la alerta
  # Umbrales del motor estadístico: una característica se marca con drift si el
  # PSI supera `psi_threshold` o si el contraste KS rechaza a nivel `ks_alpha`.
  psi_threshold: 0.2
  ks_alpha: 0.05
  # Proporción de VUS compartidas que pasan a resueltas a partir de la cual la
  # deriva de reclasificación dispara alerta.
  reclassified_threshold: 0.02

train:
  # Modelo de reclasificación: la selección de algoritmo usa validación cruzada
  # repetida y estratificada SOLO sobre el conjunto de entrenamiento. Con una
  # clase positiva tan minoritaria, una única partición de 5 pliegues es
  # demasiado inestable para decidir con ella.
  reclass_cv_splits: 5
  reclass_cv_repeats: 5
  # ROC AUC mínimo exigido antes de presentar la probabilidad de reclasificación
  # como señal utilizable. Convención operativa, sin base estadística formal.
  reclass_reliable_roc_auc: 0.6
