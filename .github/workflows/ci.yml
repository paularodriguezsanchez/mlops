name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Auditoría de dependencias (pip-audit)
        # Bloqueante, con las excepciones declaradas una a una por identificador.
        # Antes corría con continue-on-error, lo que dejaba el paso en verde aunque
        # hubiera vulnerabilidades sin revisar. Las dos que se ignoran aquí son
        # transitivas y no tienen corrección publicada; su evaluación de riesgo y
        # el motivo de aceptarlas están en docs/SECURITY_AUDIT.md. Cualquier
        # hallazgo distinto de estos dos tumba el pipeline a propósito.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-2447 \
            --ignore-vuln PYSEC-2026-3740
      - name: Tests (pytest)
        run: pytest -q
