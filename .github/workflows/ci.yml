name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Auditoría de dependencias (pip-audit)
        # No bloqueante: un CVE de terceros sin versión de corrección publicada
        # (revisión interna del proyecto) no debe tumbar el pipeline; queda visible en
        # el log para seguimiento manual.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Tests (pytest)
        run: pytest -q
